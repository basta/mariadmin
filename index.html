<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the layout can pay attention to the notch and the
         home indicator through env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0a08" />
    <meta name="color-scheme" content="dark" />

    <title>Maří Magdalena — web</title>

    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="icon" href="/admin/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/admin/apple-touch-icon.png" />
    <!-- Added to the home screen this opens without Safari's chrome, which is
         what makes it feel like the app she already knows. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maří web" />

    <!-- The site's own faces, served from the same origin by api.py. No
         third-party request, and the diacritics are already subsetted in. -->
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  </head>

  <body>
    <noscript>Tato stránka potřebuje JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
